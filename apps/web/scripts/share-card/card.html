<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Fonts and art come from the repo, so the card renders offline. Colours match shared/brand/theme.json (light). */
  @font-face { font-family: "Young Serif"; src: url("../../node_modules/@fontsource/young-serif/files/young-serif-latin-400-normal.woff2"); }
  @font-face { font-family: "Ovo"; src: url("../../node_modules/@fontsource/ovo/files/ovo-latin-400-normal.woff2"); }
  :root { --bg: #e9e4d8; --ink: #1e1e1e; --muted: #5e5a52; --coral: #f26a4b; --line: #d2cbbb; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); position: relative; font-family: "Ovo", serif; color: var(--ink); }
  .logo { position: absolute; left: 72px; top: 64px; height: 58px; }
  .copy { position: absolute; left: 72px; top: 176px; width: 540px; }
  h1 { font-family: "Young Serif", serif; font-weight: 400; font-size: 68px; line-height: 1.06; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: var(--coral); }
  p { margin-top: 28px; font-size: 27px; line-height: 1.4; color: var(--muted); }
  .strip { position: absolute; left: 72px; bottom: 52px; width: 540px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 24px; display: flex; align-items: center; gap: 12px; }
  .strip i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
  .shot { position: absolute; left: 664px; top: 86px; width: 800px; border-radius: 22px 0 0 22px; background: #f4efe4; border: 1px solid var(--line);
    box-shadow: 0 30px 60px -20px rgba(30, 30, 30, 0.35); overflow: hidden; transform: rotate(-2deg); transform-origin: left center; }
  .bar { height: 38px; background: #f4efe4; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding-left: 18px; }
  .bar b { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .shot img { display: block; width: 800px; height: 439px; object-fit: cover; object-position: left top; }
</style>
</head>
<body>
  <img class="logo" src="../../design/brand/logo-light.png" alt="DayFlow" />
  <div class="copy">
    <h1>Organize your day. <em>Elevate</em> your flow.</h1>
    <p>Clients, projects, tasks, meetings and notes in one workspace for freelancers.</p>
  </div>
  <div class="strip"><i></i>dayflow-web-version.vercel.app</div>
  <div class="shot">
    <div class="bar"><b></b><b></b><b></b></div>
    <img src="../../public/images/dayflow/screens/dashboard-light.webp" alt="" />
  </div>
</body>
</html>
