<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_SEO_TITLE%</title>
    <meta name="description" content="%BRAND_SEO_DESCRIPTION%" />
    <link rel="canonical" href="%BRAND_SITE_URL%/" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" data-app-theme />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="%BRAND_FAVICON_LIGHT%" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="%BRAND_FAVICON_DARK%" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BRAND_APPLE_TOUCH%" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_SEO_TITLE%" />
    <meta property="og:description" content="%BRAND_SEO_DESCRIPTION%" />
    <meta property="og:locale" content="%BRAND_SEO_LOCALE%" />
    <meta property="og:image" content="%BRAND_IMAGE_URL%" />
    <meta property="og:image:width" content="%BRAND_IMAGE_WIDTH%" />

    <meta property="og:image:type" content="%BRAND_IMAGE_TYPE%" />
    <meta property="og:image:alt" content="%BRAND_IMAGE_ALT%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_SEO_TITLE%" />
    <meta name="twitter:description" content="%BRAND_SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%BRAND_IMAGE_URL%" />
    <meta name="twitter:image:alt" content="%BRAND_IMAGE_ALT%" />

    <script type="application/ld+json">%BRAND_JSON_LD%</script>
