name: dayflow
description: "DayFlow mobile app: UI-only milestone with sample data."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/brand/
    - images/illustrations/
  fonts:
    - family: Ovo
      fonts:
        - asset: fonts/Ovo-Regular.ttf
    - family: YoungSerif
      fonts:
        - asset: fonts/YoungSerif-Regular.ttf
